name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test client
        run: ./gradlew :jikan:test
      - name: Build library and sample
        run: ./gradlew :jikan-tv:assembleRelease :sample:assembleDebug
      - name: Verify publishing (what JitPack runs)
        run: ./gradlew publishToMavenLocal

  screenshots:
    name: README screenshots
    # Live MyAnimeList data. api.jikan.moe drops connections from GitHub-hosted runners, so the job runs
    # the open source Jikan server (jikan-rest) itself and points the sample's scenes at it.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Start a Jikan server
        # jikan-rest with MongoDB in Docker, loaded from MyAnimeList with the anime the screens list.
        run: bash scripts/jikan-server.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build sample
        run: ./gradlew :sample:assembleDebug
      - name: Capture screenshots on an Android TV emulator
        # Home with the season hero and rails, an anime detail, and the season browser.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: JIKAN_API_URL=http://10.0.2.2:8080/v4/ bash scripts/screenshots.sh
      - name: Jikan server log
        if: failure()
        run: docker logs jikan 2>&1 | tail -n 120 || true
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
